<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="terminal-1000">
  <!--
    terminal-1000 应用图标（矢量源文件）。
    设计：深色圆角方块 + 一支青色命令提示符 `>_`。
    只用一个字形族 —— 缩到 16px（托盘/任务栏）时仍然能认出是终端，
    加窗口标题栏、像素网格之类的细节在这个尺寸下只会糊成一团。
    渐变与描边都是"给 512px 看的"，缩放后自然消失，不需要另做小尺寸版本。
  -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1c2634"/>
      <stop offset="0.55" stop-color="#111823"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.46">
      <stop offset="0" stop-color="#3ec9d6" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#3ec9d6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3ec9d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="150" y1="176" x2="356" y2="336">
      <stop offset="0" stop-color="#7feaf3"/>
      <stop offset="0.5" stop-color="#3ec9d6"/>
      <stop offset="1" stop-color="#22a7bb"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="#080a0e"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#glow)"/>
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <g fill="none" stroke="url(#ink)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 190 L244 256 L172 322"/>
    <path d="M278 322 L344 322"/>
  </g>
</svg>
