# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (C) 2026 terminal-1000 contributors
#
# 打包配置（electron-builder）。
#
# 设计取向：**体积优先**。
# 参考实现的 app.asar 是 92MB（单文件、未分包、内嵌 15MB 补全语料与 3MB i18n 单文件），
# 我们的目标是安装包 ≤100MB 且应用代码本身远小于它。

appId: io.github.terminal1000
productName: terminal-1000
# 不加这行的话可执行文件名会取自 package.json 的 name（`@t1000/desktop` → `@t1000desktop`），
# 带 scope 前缀既难用又难看
executableName: terminal-1000
# package.json 的 name 是带 scope 的 `@t1000/desktop`，会让 deb 包名变成
# `@t1000/desktop_0.1.0_amd64.deb`（非法且难看）。这里在打包元数据里覆盖成规范名。
extraMetadata:
  name: terminal-1000
copyright: Copyright (C) 2026 terminal-1000 contributors

directories:
  output: release
  buildResources: build

# 只打包构建产物与清单。
# 源码、spec/、research/ 一律不进包 —— 后者是逆向研究材料，按项目约定不进入分发物。
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/{spec,research,docs}/**'
  - '!**/{.eslintrc,.editorconfig,tsconfig*.json,electron.vite.config.*}'
  # workspace 包 @t1000/shared 是 TS 源码、已被完整内联进 bundle
  # （产物里 0 处运行时引用），且它的真实路径在 apps/desktop 之外 ——
  # electron-builder 无法打包本目录以外的文件，必须排除。
  - '!node_modules/@t1000/**'

  # 只保留**本平台**的原生二进制 —— 过滤规则必须按 target 平台拆到
  # linux:/win:/mac: 段里。曾经把 win32-* 全局排除，结果 Windows 包里没有
  # better_sqlite3.node，应用一启动就崩（Cannot find module）。
  # better-sqlite3 随包带 8 个平台的 prebuild（约 34MB），只留本平台。
  # ⚠️ 将来要出 arm64 / musl 包时必须按 arch 分别配置，不能沿用这几条。

  # typescript 只为「动态背景 TS 脚本」在主进程做类型剥离（transpileModule 不做类型检查），
  # 70MB 的 lib/*.d.ts 与各 ES 版本 lib 全都用不上 —— 只保留 typescript.js 本体。
  - '!**/node_modules/typescript/lib/**'
  - '**/node_modules/typescript/lib/typescript.js'

# 原生模块必须解出 asar：.node 文件无法从 asar 内加载
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/node-pty/**'

# 运行时图标：`build/` 是打包资源目录，里面的文件**不会**进 app.asar，
# 而窗口图标与托盘图标要在运行时按路径读取，所以显式复制到 resources/。
# 应用主图标（安装包/桌面项/任务栏）由 electron-builder 从 build/icon.png 自动生成
# 各平台格式（deb/rpm/pacman 的 hicolor、flatpak 的 icons、Windows 的 .ico）。
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/tray.png
    to: tray.png
  # 监控代理：三架构静态二进制（已 gzip）。连接时按远端 uname -m 选一份上传，
  # 服务器上不需要 python / Go / glibc。未压缩约 5 MiB，压缩后约 2 MiB/份。
  - from: build/agent
    to: agent
  # kitty VT 内核（WASM）。渲染层从主进程读它再交给 Worker：
  # 打包后页面是 file://，Worker 里的 fetch 会被同源策略挡掉。
  - from: vendor/kitty-vt-wasm/dist/kitty-vt.wasm
    to: kitty-vt.wasm
  # 动态背景内置脚本（TS 源码）：运行时由主进程读取并转译
  - from: resources/background-scripts
    to: background-scripts

# 不做 npm rebuild：原生模块已由 scripts/rebuild-native.mjs 针对 Electron ABI 重建过，
# 让 electron-builder 再跑一遍既慢又可能因为 pnpm 的符号链接布局失败
npmRebuild: false

# Electron 自带 50+ 个语言包（约 7.8MB）。我们只做中英界面，其余是纯浪费。
electronLanguages:
  - en-US
  - zh-CN

# 安装包用最高压缩：目标是把安装包压到 ≤100MB
compression: maximum


linux:
  # **必须给目录而不是单张 PNG**：只给一张 1024x1024 时，桌面环境按自己的偏好
  # 去找 48/64/128 尺寸，找不到就回退到缓存里旧版本留下的路径 —— 表现就是
  # 「装了新版本，图标还是老的」。build/icons/ 里的 9 个尺寸由 scripts/gen-icons.sh
  # 从 icon.svg 渲染，electron-builder 会把它们铺成完整的 hicolor 树。
  icon: build/icons
  # 只留 glibc linux-x64 的原生二进制（顶层注释见「只保留本平台」段）
  files:
    - '!**/node_modules/better-sqlite3/prebuilds/darwin-*'
    - '!**/node_modules/better-sqlite3/prebuilds/win32-*'
    - '!**/node_modules/better-sqlite3/prebuilds/linuxmusl-*'
    - '!**/node_modules/better-sqlite3/prebuilds/linux-arm64*'
    - '!**/node_modules/node-pty/prebuilds/darwin-*/**'
    - '!**/node_modules/node-pty/prebuilds/win32-*/**'
  target:
    - deb
    - AppImage
    - rpm
    - pacman
    - flatpak
# rpm / pacman 也补上安装后刷新图标缓存（与 deb 同样的原因）
rpm:
  afterInstall: build/after-install.sh
pacman:
  afterInstall: build/after-install.sh

# Electron 45 需要 24.08 运行时（默认 20.08 的 glibc 跑不起来），BaseApp 提供 Electron 运行环境
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: 24.08
  base: org.electronjs.Electron2.BaseApp
  baseVersion: 24.08
  category: Network
  synopsis: 远程连接管理器（SSH/SFTP/Telnet/VNC/RDP）
  description: >-
    terminal-1000 是一个远程连接管理器：SSH / SFTP / Telnet / 端口转发 / VNC / RDP，
    带终端工作区、并发广播、系统监控、命令补全、AI 助手、MCP、笔记与加密存储。
  desktop:
    entry:
      Name: terminal-1000
      Comment: 远程连接管理器
      Categories: Network;Utility;Development;

deb:
  # 安装/升级后刷新图标缓存，否则桌面仍显示旧图标（或空白方块）
  afterInstall: build/after-install.sh
  # 依赖由 Electron 自带，不额外引入系统库
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

# Windows 交叉构建（实验性）：wine 已装可出 NSIS 安装器；原生模块（node-pty/better-sqlite3）
# 仍是在 Linux ABI 下重建的，未做 win32 交叉编译 —— 正式 Windows 包应在 Windows CI 上出。
win:
  target:
    - nsis
  # 交叉构建（wine）时 rcedit 改 exe 资源不可靠，关掉；VM/CI 原生构建时
  # 用 `-c.win.signAndEditExecutable=true` CLI 覆盖，否则 exe/快捷方式
  # 都是 Electron 原版图标。
  signAndEditExecutable: false
  files:
    - '!**/node_modules/better-sqlite3/prebuilds/darwin-*'
    - '!**/node_modules/better-sqlite3/prebuilds/linux-*'
    - '!**/node_modules/better-sqlite3/prebuilds/linuxmusl-*'
    - '!**/node_modules/node-pty/prebuilds/darwin-*/**'
    - '!**/node_modules/node-pty/prebuilds/linux-*/**'

nsis:
  # 卸载（以及升级时先跑的旧卸载器）**绝不删用户数据**。
  # 数据本来就在 %APPDATA%\terminal-1000，不在安装目录里；这条是防止
  # electron-builder 的默认值将来变化，把「升级即丢设置」重新引回来。
  deleteAppDataOnUninstall: false
